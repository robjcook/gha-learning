# Phase 1 — Anatomy of a Workflow
# Smallest complete CI: check out, set up Node with npm caching, install, test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Exercise 3: contexts. On a pull_request run ref_name is "<PR#>/merge";
      # head_ref holds the source branch (empty on push events).
      - run: echo "Branch is ${{ github.ref_name }}"
      - run: |
          echo "event:    ${{ github.event_name }}"
          echo "ref:      ${{ github.ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "base_ref: ${{ github.base_ref }}"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
